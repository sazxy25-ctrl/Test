
name: Saxzy Mod VIP - Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Find Xcode Project
        shell: bash
        run: |
          PROJECT=$(find . -name "ThreeOneOSFive.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Check Scheme
        run: |
          xcodebuild -list -project "$PROJECT"

      - name: Build IPA
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/Build/Build/Products/Release-iphoneos/ThreeOneOSFive.app"

          if [ ! -d "$APP" ]; then
            echo "Built app not found!"
            find "$RUNNER_TEMP/Build/Build/Products" -maxdepth 3
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/ThreeOneOSFive.app
          zip -qry Saxzy-Mod-VIP.ipa Payload

      - name: Check IPA Size
        run: |
          SIZE=$(stat -f%z Saxzy-Mod-VIP.ipa)
          SIZE_MB=$((SIZE / 1048576))

          echo "IPA size: ${SIZE_MB} MB"

          if [ "$SIZE" -lt 6291456 ]; then
            echo "IPA is smaller than 6 MB."
            exit 1
          fi

          echo "IPA size requirement passed."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saxzy-Mod-VIP-IPA
          path: Saxzy-Mod-VIP.ipa
          if-no-files-found: error
          retention-days: 14
